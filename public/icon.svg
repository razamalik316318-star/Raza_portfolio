<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle with Gradient -->
  <circle cx="16" cy="16" r="16" fill="url(#grad)"/>
  <!-- Cartoon Person Head (Facebook style) -->
  <circle cx="16" cy="12" r="5.5" fill="#fff"/>
  <!-- Cartoon Person Body -->
  <ellipse cx="16" cy="21" rx="6" ry="7" fill="#fff"/>
  <!-- Left Eye -->
  <circle cx="14" cy="11" r="1.2" fill="#667eea"/>
  <!-- Right Eye -->
  <circle cx="18" cy="11" r="1.2" fill="#667eea"/>
  <!-- Smile (Happy expression) -->
  <path d="M 13 14.5 Q 16 17 19 14.5" stroke="#667eea" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Cheeks (optional, for cute look) -->
  <circle cx="12" cy="13.5" r="1" fill="#ffb3d9" opacity="0.6"/>
  <circle cx="20" cy="13.5" r="1" fill="#ffb3d9" opacity="0.6"/>
</svg>

